<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mc Wer - Fast Food Restaurant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo">Mc <span>Wer</span></a>
    <nav class="nav-links">
      <a href="product.html?cat=food">Food</a>
      <a href="product.html?cat=drinks">Drinks</a>
      <a href="product.html?cat=desserts">Desserts</a>
      <a href="cart.html" class="cart-btn">
        🛒 Cart
        <span class="cart-count" style="display:none">0</span>
      </a>
    </nav>
  </header>

  <!-- TOP IMAGE BAR -->
  <div class="top-bar">
    <div class="top-images">
      <img class="top-img" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300&h=200&fit=crop" alt="Burger">
      <img class="top-img" src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300&h=200&fit=crop" alt="Pizza">
      <img class="top-img" src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=300&h=200&fit=crop" alt="Taco">
      <img class="top-img" src="https://images.unsplash.com/photo-1576107232684-1279f390859f?w=300&h=200&fit=crop" alt="Fries">
      <img class="top-img" src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300&h=200&fit=crop" alt="Cola">
      <img class="top-img" src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=300&h=200&fit=crop" alt="Ice Cream">
      <img class="top-img" src="https://images.unsplash.com/photo-1606755962773-d324e0a13086?w=300&h=200&fit=crop" alt="Chicken">
      <img class="top-img" src="https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=300&h=200&fit=crop" alt="Shake">
    </div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <h1>Welcome to Mc Wer</h1>
    <p>Delicious fast food • Fresh ingredients • Fast delivery</p>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <a href="product.html?cat=food" class="category-card">
      <img src="https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=600&h=400&fit=crop" alt="Food">
      <span class="badge">HOT</span>
      <div class="info">
        <h2>Food</h2>
        <p>Burgers, Pizza, Tacos, Fries & more</p>
      </div>
    </a>

    <a href="product.html?cat=drinks" class="category-card">
      <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=600&h=400&fit=crop" alt="Drinks">
      <span class="badge">COLD</span>
      <div class="info">
        <h2>Drinks</h2>
        <p>Cola, Juice, Milkshakes & more</p>
      </div>
    </a>

    <a href="product.html?cat=desserts" class="category-card">
      <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=600&h=400&fit=crop" alt="Desserts">
      <span class="badge">SWEET</span>
      <div class="info">
        <h2>Desserts</h2>
        <p>Ice Cream, Brownies & toppings</p>
      </div>
    </a>
  </section>

  <footer>
    <p>© 2026 <span class="brand">Mc Wer</span> — Fast • Fresh • Delicious</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
